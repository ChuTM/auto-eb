<div class="autoeb-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transform: translateY(50%); transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); z-index: 2147483647;">
    <div class="autoeb-settings-card" style="background: #1e1e1e; color: #ffffff; padding: 2rem; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-family: sans-serif; border: 1px solid #333;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 style="margin: 0; font-size: 1.5rem; font-weight: 600;">Engine Parameters</h2>
            <div class="overlay-close"><button class="close-button" style="background: transparent; border: none; color: #888; cursor: pointer; font-size: 1.2rem;">&times;</button></div>
        </div>
        
        <!-- Live tracking module inside operational controller panel -->
        <div class="autoeb-status-text" style="margin-bottom: 1.5rem; font-size: 0.9rem; color: #aaa; font-weight: 500; transition: color 0.2s ease;">Status: Idle</div>

        <div style="margin-bottom: 1.2rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: #aaa;">Target Correct Count</label>
            <input type="number" id="AUTOEB_CORRECT_TARGET" style="width: 100%; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; padding: 0.6rem; color: white; box-sizing: border-box;" placeholder="e.g. 8">
        </div>

        <div style="margin-bottom: 1.2rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: #aaa;">Step Delay Latency (ms)</label>
            <input type="number" id="AUTOEB_TIMEOUT" style="width: 100%; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; padding: 0.6rem; color: white; box-sizing: border-box;" placeholder="e.g. 2000">
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #333;">
            <span style="font-size: 0.85rem; color: #aaa;">Continuous Answering Mode</span>
            <label class="switch" style="position: relative; display: inline-block; width: 44px; height: 24px;">
                <input type="checkbox" id="AUTOEB_AVOID_CONTINUOUS_ANSWERING" style="opacity: 0; width: 0; height: 0;">
                <span class="slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 24px;"></span>
            </label>
        </div>
        <div style="font-size: 0.75rem; color: #666; margin-top: 0.4rem; text-align: right;" class="AUTOEB_AVOID_CONTINUOUS_ANSWERING-descriptive-text">Continuously</div>
    </div>
</div>
